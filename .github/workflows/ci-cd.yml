
name: SweetCrumb Kubernetes CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sweetcrumb-k8s-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_REPOSITORY: ccdennar/web_cms
  APP_DIR: application/bakery-backend
  IMAGE_NAME: sweetcrumb-bakery-backend
  IMAGE_TAG: ci
  CLUSTER_NAME: sweetcrumb
  NAMESPACE: sweetcrumb

jobs:
  kubernetes-deployment:
    name: Build, Deploy and Test
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      # ============================================
      # PHASE 1: CHECKOUT REPOSITORIES
      # ============================================

      - name: Checkout Kubernetes repository
        uses: actions/checkout@v4
        with:
          path: infrastructure

      - name: Checkout Payload CMS application
        uses: actions/checkout@v4
        with:
          repository: ${{ env.APP_REPOSITORY }}
          ref: main
          path: application

      # ============================================
      # PHASE 2: VALIDATE PROJECT STRUCTURE
      # ============================================

      - name: Validate project files
        shell: bash
        run: |
          set -euo pipefail

          echo "Validating application and Kubernetes files..."

          test -f "$APP_DIR/Dockerfile"
          test -d infrastructure/k8s

          echo "Application Dockerfile found."
          echo "Kubernetes manifests directory found."

          echo "Available Kubernetes manifests:"
          find infrastructure/k8s \
            -type f \( -name "*.yaml" -o -name "*.yml" \) \
            -print

      # ============================================
      # PHASE 3: BUILD DOCKER IMAGE
      # ============================================

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Payload CMS Docker image
        shell: bash
        run: |
          set -euo pipefail

          echo "Building Payload CMS Docker image..."

          docker build \
            -t "$IMAGE_NAME:$IMAGE_TAG" \
            -f "$APP_DIR/Dockerfile" \
            "$APP_DIR"

          echo "Docker image built successfully."

      - name: Verify Docker image
        shell: bash
        run: |
          set -euo pipefail

          docker image inspect "$IMAGE_NAME:$IMAGE_TAG"

      # ============================================
      # PHASE 4: CREATE KIND CLUSTER
      # ============================================

      - name: Create Kubernetes Kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: sweetcrumb
          wait: 120s

      - name: Verify Kubernetes cluster
        shell: bash
        run: |
          set -euo pipefail

          kubectl cluster-info
          kubectl get nodes -o wide

      # ============================================
      # PHASE 5: LOAD IMAGE INTO KIND
      # ============================================

      - name: Load Docker image into Kind
        shell: bash
        run: |
          set -euo pipefail

          kind load docker-image \
            "$IMAGE_NAME:$IMAGE_TAG" \
            --name "$CLUSTER_NAME"

          echo "Docker image loaded into Kind."

      # ============================================
      # PHASE 6: CREATE NAMESPACE AND SECRETS
      # ============================================

      - name: Create Kubernetes namespace
        shell: bash
        run: |
          set -euo pipefail

          kubectl create namespace "$NAMESPACE" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Create application secrets
        shell: bash
        env:
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          set -euo pipefail

          : "${PAYLOAD_SECRET:?Missing PAYLOAD_SECRET}"
          : "${DATABASE_URL:?Missing DATABASE_URL}"
          : "${POSTGRES_PASSWORD:?Missing POSTGRES_PASSWORD}"

          kubectl -n "$NAMESPACE" create secret generic bakery-secrets \
            --from-literal=PAYLOAD_SECRET="$PAYLOAD_SECRET" \
            --from-literal=DATABASE_URL="$DATABASE_URL" \
            --from-literal=POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -

          echo "Application secrets configured."

      # ============================================
      # PHASE 7: DEPLOY KUBERNETES RESOURCES
      # ============================================

      - name: Deploy Kubernetes manifests
        shell: bash
        run: |
          set -euo pipefail

          echo "Deploying SweetCrumb Kubernetes resources..."

          kubectl apply -R -f infrastructure/k8s/

          kubectl -n "$NAMESPACE" get all

      # ============================================
      # PHASE 8: VERIFY POSTGRESQL
      # ============================================

      - name: Wait for PostgreSQL
        shell: bash
        run: |
          set -euo pipefail

          echo "Waiting for PostgreSQL StatefulSet..."

          kubectl -n "$NAMESPACE" rollout status \
            statefulset/postgres \
            --timeout=240s

          echo "PostgreSQL workload is ready."

      # ============================================
      # PHASE 9: VERIFY BACKEND DEPLOYMENT
      # ============================================

      - name: Wait for Payload CMS backend
        shell: bash
        run: |
          set -euo pipefail

          echo "Waiting for bakery backend..."

          kubectl -n "$NAMESPACE" rollout status \
            deployment/bakery-backend \
            --timeout=240s

          echo "Backend deployment is ready."

      - name: Inspect deployed workloads
        shell: bash
        run: |
          set -euo pipefail

          kubectl -n "$NAMESPACE" get pods -o wide
          kubectl -n "$NAMESPACE" get services
          kubectl -n "$NAMESPACE" get pvc

      # ============================================
      # PHASE 10: DATABASE INTEGRATION TEST
      # ============================================

      - name: Verify Payload CMS database integration
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " Payload CMS Database Integration Test"
          echo "=========================================="

          TEST_POD="bakery-db-test-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          cleanup() {
            echo "Cleaning up integration test pod..."

            kubectl -n "$NAMESPACE" delete pod "$TEST_POD" \
              --ignore-not-found=true \
              --wait=false || true
          }

          trap cleanup EXIT

          echo "Namespace: $NAMESPACE"
          echo "Test pod: $TEST_POD"
          echo "Endpoint: http://bakery-backend/api/health"

          echo "Checking backend deployment..."

          kubectl -n "$NAMESPACE" rollout status \
            deployment/bakery-backend \
            --timeout=180s

          echo "Checking backend service..."

          kubectl -n "$NAMESPACE" get service bakery-backend

          echo "Starting database integration test..."

          if kubectl -n "$NAMESPACE" run "$TEST_POD" \
            --image=curlimages/curl:8.12.1 \
            --restart=Never \
            --rm \
            -i \
            --pod-running-timeout=120s \
            --command -- \
            sh -ec '
              for attempt in $(seq 1 20); do

                echo "Health check attempt: $attempt/20"

                if curl \
                  --fail \
                  --silent \
                  --show-error \
                  --max-time 10 \
                  http://bakery-backend/api/health; then

                  echo ""
                  echo "Payload CMS database integration passed."
                  exit 0
                fi

                echo "Health check failed. Retrying..."
                sleep 5
              done

              echo "Payload CMS database integration failed."
              exit 1
            '; then

            echo "=========================================="
            echo " DATABASE INTEGRATION TEST PASSED"
            echo "=========================================="

          else

            echo "=========================================="
            echo " DATABASE INTEGRATION TEST FAILED"
            echo "=========================================="

            echo "Backend pods:"
            kubectl -n "$NAMESPACE" get pods -o wide || true

            echo "Backend service:"
            kubectl -n "$NAMESPACE" describe service bakery-backend || true

            echo "Backend logs:"
            kubectl -n "$NAMESPACE" logs \
              deployment/bakery-backend \
              --tail=100 || true

            exit 1
          fi

      # ============================================
      # PHASE 11: HTTP SMOKE TEST
      # ============================================

      - name: Run application HTTP smoke test
        shell: bash
        run: |
          set -euo pipefail

          echo "Starting application HTTP smoke test..."

          kubectl -n "$NAMESPACE" run bakery-smoke-test \
            --image=curlimages/curl:8.12.1 \
            --restart=Never \
            --rm \
            -i \
            --pod-running-timeout=120s \
            --command -- \
            sh -ec '
              curl \
                --fail \
                --silent \
                --show-error \
                --max-time 15 \
                http://bakery-backend/api/health

              echo ""
              echo "HTTP smoke test passed."
            '

      # ============================================
      # PHASE 12: FAILURE DIAGNOSTICS
      # ============================================

      - name: Collect Kubernetes diagnostics
        if: failure()
        shell: bash
        run: |
          echo "=========================================="
          echo " Kubernetes Failure Diagnostics"
          echo "=========================================="

          kubectl get nodes -o wide || true

          kubectl -n "$NAMESPACE" get all -o wide || true

          kubectl -n "$NAMESPACE" get pvc || true

          kubectl -n "$NAMESPACE" get events \
            --sort-by=.lastTimestamp || true

          echo "Backend deployment:"
          kubectl -n "$NAMESPACE" describe \
            deployment/bakery-backend || true

          echo "Backend logs:"
          kubectl -n "$NAMESPACE" logs \
            deployment/bakery-backend \
            --all-pods=true \
            --all-containers=true \
            --tail=150 || true

          echo "PostgreSQL logs:"
          kubectl -n "$NAMESPACE" logs \
            statefulset/postgres \
            --all-containers=true \
            --tail=100 || true

      # ============================================
      # PHASE 13: DEPLOYMENT SUMMARY
      # ============================================

      - name: Deployment summary
        if: success()
        shell: bash
        run: |
          {
            echo "## SweetCrumb Kubernetes Deployment"
            echo ""
            echo "| Component | Status |"
            echo "|---|---|"
            echo "| Docker image | Built |"
            echo "| Kind cluster | Created |"
            echo "| PostgreSQL | Ready |"
            echo "| Payload CMS | Ready |"
            echo "| Database integration | Passed |"
            echo "| HTTP smoke test | Passed |"
            echo ""
            echo "Namespace: \`$NAMESPACE\`"
            echo ""
            echo "Image: \`$IMAGE_NAME:$IMAGE_TAG\`"
          } >> "$GITHUB_STEP_SUMMARY"
