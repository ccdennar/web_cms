name: CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'bakery-backend/**'
      - '.github/workflows/ci-cd.yml'
  pull_request:
    branches: [main]
    paths:
      - 'bakery-backend/**'
      - '.github/workflows/ci-cd.yml'
  workflow_dispatch:

env:
  BACKEND_DIR: bakery-backend
  IMAGE_NAME: ghcr.io/ccdennar/sweetcrumb-bakery-backend
  NODE_VERSION: "22"
  # ✅ FIX: Global default matches the postgres service container credentials
  DATABASE_URL: postgresql://payload:payload@localhost:5432/payload_test
  PAYLOAD_SECRET: ci-test-secret-not-real

permissions:
  contents: read
  packages: write
  security-events: write
  id-token: write

jobs:
  # ─────────────────────────────────────────────────────────────
  # 1. BUILD & TEST
  # ─────────────────────────────────────────────────────────────
  build-and-test:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.BACKEND_DIR }}

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: payload
          POSTGRES_PASSWORD: payload
          POSTGRES_DB: payload_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payload -d payload_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # ✅ FIX: Explicitly set BOTH variables to match the service container
    env:
      DATABASE_URL: postgresql://payload:payload@localhost:5432/payload_test
      DATABASE_URI: postgresql://payload:payload@localhost:5432/payload_test
      PAYLOAD_SECRET: ci-test-secret-not-real

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: ${{ env.BACKEND_DIR }}/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

      - name: Generate Payload types + TypeScript check
        run: |
          pnpm payload generate:types
          pnpm typecheck

      - name: Run integration tests
        run: pnpm test:int -- --reporter=default --reporter=junit --outputFile=test-results/int.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ${{ env.BACKEND_DIR }}/test-results/
          if-no-files-found: warn # ✅ FIX: Prevents upload failure if tests crashed early
          retention-days: 14

      - name: Build application
        run: pnpm build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: ${{ env.BACKEND_DIR }}/.next/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # 2. DOCKER IMAGE + SCAN + SBOM + SMOKE TEST
  # ─────────────────────────────────────────────────────────────
  docker:
    name: Docker · Scan · SBOM
    runs-on: ubuntu-latest
    needs: build-and-test

    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine image tag
        id: meta
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "tag=latest-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=pr-${{ github.event.pull_request.number || 'manual' }}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.BACKEND_DIR }}
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=bakery-backend
          cache-to: type=gha,mode=max,scope=bakery-backend

      # ✅ FIX: Updated to v0.31.0 to resolve setup-trivy missing version errors
           # 10. Scan dependencies (lockfile) with Trivy (Docker Native)
      - name: Trivy — dependency scan
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/${{ env.BACKEND_DIR }}:/workspace \
            -v /tmp/trivy-cache:/root/.cache/ \
            aquasec/trivy:0.58.0 \
            fs /workspace --format sarif --output /workspace/trivy-deps.sarif --severity CRITICAL,HIGH
        working-directory: ${{ github.workspace }}

      # 10b. Scan the built image with Trivy (Docker Native)
      - name: Trivy — image scan
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v /tmp/trivy-cache:/root/.cache/ \
            aquasec/trivy:0.58.0 \
            image --format sarif --output trivy-image.sarif --severity CRITICAL,HIGH --ignore-unfixed ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}

      - name: Upload Trivy results to GitHub Security tab
        if: always() && hashFiles('trivy-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image.sarif

      - name: Upload scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            ${{ env.BACKEND_DIR }}/trivy-deps.sarif
            trivy-image.sarif
          if-no-files-found: warn

      # Fail the pipeline if the IMAGE has fixable CRITICAL vulnerabilities
      - name: Trivy — gate on critical image vulnerabilities
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v /tmp/trivy-cache:/root/.cache/ \
            aquasec/trivy:0.58.0 \
            image --severity CRITICAL --ignore-unfixed --exit-code 1 ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}

      - name: Generate SBOM
        uses: anchore/sbom-action@v0.17.2
        with:
          image: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json

      # ✅ FIX: Bulletproof smoke test with dedicated, guaranteed-to-start PostgreSQL container
      - name: Smoke test
        run: |
          set -euo pipefail
          echo "🚀 Starting PostgreSQL service for smoke test..."
          
          docker run -d --name smoke-postgres \
            -e POSTGRES_USER=payload \
            -e POSTGRES_PASSWORD=payload \
            -e POSTGRES_DB=payload_test \
            -p 5432:5432 \
            postgres:16-alpine
          
          echo "⏳ Waiting for PostgreSQL to be ready..."
          for i in $(seq 1 15); do
            if docker exec smoke-postgres pg_isready -U payload -d payload_test > /dev/null 2>&1; then
              echo "✅ PostgreSQL is ready"
              break
            fi
            sleep 2
          done

          echo "🚀 Starting application container..."
          docker run -d --name bakery-smoke \
            --network host \
            -e PAYLOAD_SECRET=smoke-test-secret \
            -e DATABASE_URL=postgresql://payload:payload@localhost:5432/payload_test \
            -e DATABASE_URI=postgresql://payload:payload@localhost:5432/payload_test \
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          
          echo "⏳ Waiting for the server to come up (max 60s)..."
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/ > /dev/null 2>&1; then
              echo "✅ Smoke test PASSED"
              docker logs bakery-smoke
              docker rm -f bakery-smoke
              docker rm -f smoke-postgres
              exit 0
            fi
            sleep 2
          done
          
          echo "❌ Smoke test FAILED — container logs:"
          echo "--- Bakery Backend Logs ---"
          docker logs bakery-smoke
          echo "--- PostgreSQL Logs ---"
          docker logs smoke-postgres
          docker rm -f bakery-smoke
          docker rm -f smoke-postgres
          exit 1

  # ─────────────────────────────────────────────────────────────
  # 3. SIGN & PUSH TO GHCR
  # ─────────────────────────────────────────────────────────────
  publish:
    name: Sign & Push to GHCR
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.BACKEND_DIR }}
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ needs.docker.outputs.image-tag }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha,scope=bakery-backend

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image with Cosign
        run: |
          cosign sign --yes \
            ${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}

      - name: Download SBOM
        uses: actions/download-artifact@v4
        with:
          name: sbom
          path: .

      - name: Attach SBOM attestation
        run: |
          cosign attest --yes \
            --predicate sbom.spdx.json \
            --type spdx \
            ${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}

      - name: Verify signature
        run: |
          cosign verify \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            ${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}

  # ─────────────────────────────────────────────────────────────
  # 4. PUBLISH REPORTS (Fail-Safe)
  # ─────────────────────────────────────────────────────────────
  publish-reports:
    name: Publish Reports
    runs-on: ubuntu-latest
    needs: [build-and-test, docker, publish]
    if: always()
    
    steps:
      # ✅ FIX: continue-on-error prevents this job from failing if previous jobs crashed before uploading
      - name: Download test results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: test-results
          path: reports/tests

      - name: Download security reports
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: security-reports
          path: reports/security

      - name: Download SBOM
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: sbom
          path: reports/sbom

      - name: Publish consolidated reports
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-reports
          path: reports/
          if-no-files-found: warn # ✅ FIX: Warns instead of failing if directory is empty
          retention-days: 30

      - name: Generate Job Summary
        if: always()
        run: |
          echo "## 📊 Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Build & Test | ${{ needs.build-and-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker & Scan | ${{ needs.docker.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Publish | ${{ needs.publish.result }} |" >> $GITHUB_STEP_SUMMARY