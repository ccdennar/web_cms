name: CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'bakery-backend/**'
      - '.github/workflows/ci-cd.yml'
  pull_request:
    branches: [main]
    paths:
      - 'bakery-backend/**'
      - '.github/workflows/ci-cd.yml'
  workflow_dispatch:

env:
  BACKEND_DIR: bakery-backend
  IMAGE_NAME: ghcr.io/ccdennar/sweetcrumb-bakery-backend
  NODE_VERSION: "22"

  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/payload_test
  PAYLOAD_SECRET: ${PAYLOAD_SECRET}

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────
  # 1–7: Build & Test
  # ─────────────────────────────────────────────────────────────
  build-and-test:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.BACKEND_DIR }}

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: payload
          POSTGRES_PASSWORD: payload
          POSTGRES_DB: payload_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payload -d payload_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://payload:payload@localhost:5432/payload_test
      DATABASE_URI: postgresql://payload:payload@localhost:5432/payload_test
      PAYLOAD_SECRET: ci-test-secret-not-real

    steps:
      # 1. Checkout source code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Configure Node.js (+ pnpm)
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10 # must match packageManager in package.json
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: ${{ env.BACKEND_DIR }}/pnpm-lock.yaml

      # 3. Install dependencies — lockfile-based, reproducible (--frozen-lockfile)
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 4. Run linting
      - name: Run ESLint
        run: pnpm lint

      # 5. Run TypeScript checks
      - name: Generate Payload types + TypeScript check
        run: |
          pnpm payload generate:types
          pnpm typecheck   # script: "tsc --noEmit" — verify it exists in package.json

      # 6. Execute unit tests (Vitest)
      - name: Run unit tests
        run: pnpm test:int -- --reporter=default --reporter=junit --outputFile=test-results/unit.xml

      # 7. Execute integration tests with PostgreSQL
      - name: Run integration tests
        run: pnpm test:int -- --reporter=default --reporter=junit --outputFile=test-results/int.xml
        env:
          DATABASE_URI: postgresql://payload:payload@localhost:5432/payload_test

      # Publish test reports (also covers step 13 for tests)
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ${{ env.BACKEND_DIR }}/test-results/
          retention-days: 14

      # 8. Build the application
      - name: Build application
        run: pnpm build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: ${{ env.BACKEND_DIR }}/.next/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # 8–10: Docker image + Trivy scan + SBOM
  # ─────────────────────────────────────────────────────────────
  docker:
    name: Docker · Scan · SBOM
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: read
      security-events: write # for Trivy SARIF upload

    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine image tag
        id: meta
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "tag=latest-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=pr-${{ github.event.pull_request.number || 'manual' }}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          fi

      # 9. Build the Docker image (load locally — push happens only after approval)
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.BACKEND_DIR }}
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=bakery-backend
          cache-to: type=gha,mode=max,scope=bakery-backend

                  # 10. Scan dependencies (lockfile) with Trivy (Docker Native)
      - name: Trivy — dependency scan
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/${{ env.BACKEND_DIR }}:/workspace \
            -v /tmp/trivy-cache:/root/.cache/ \
            aquasec/trivy:0.58.0 \
            fs /workspace --format sarif --output /workspace/trivy-deps.sarif --severity CRITICAL,HIGH
        working-directory: ${{ github.workspace }}

      # 10b. Scan the built image with Trivy (Docker Native)
      - name: Trivy — image scan
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v /tmp/trivy-cache:/root/.cache/ \
            aquasec/trivy:0.58.0 \
            image --format sarif --output trivy-image.sarif --severity CRITICAL,HIGH --ignore-unfixed ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}

      - name: Upload Trivy results to GitHub Security tab
        if: always() && hashFiles('trivy-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image.sarif

      - name: Upload scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            ${{ env.BACKEND_DIR }}/trivy-deps.sarif
            trivy-image.sarif
          if-no-files-found: warn

      # Fail the pipeline if the IMAGE has fixable CRITICAL vulnerabilities
      - name: Trivy — gate on critical image vulnerabilities
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v /tmp/trivy-cache:/root/.cache/ \
            aquasec/trivy:0.58.0 \
            image --severity CRITICAL --ignore-unfixed --exit-code 1 ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
      # 11. Generate an SBOM (Syft, SPDX format)
      - name: Generate SBOM
        uses: anchore/sbom-action@v0.17.2
        with:
          image: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json
      
    # 11b. Smoke test — start the container and hit an endpoint
      - name: Smoke test
        run: |
          echo "🚀 Starting smoke test container..."
          
          # Use --network host so the container can reach the 'postgres' service on localhost
          docker run -d --name bakery-smoke \
            --network host \
            -e PAYLOAD_SECRET=smoke-test-secret \
            -e DATABASE_URL=postgresql://payload:payload@localhost:5432/payload_test \
            -e DATABASE_URI=postgresql://payload:payload@localhost:5432/payload_test \
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          
          echo "⏳ Waiting for the server to come up (max 60s)..."
          for i in $(seq 1 30); do
            # Payload CMS root endpoint is the most reliable health check
            if curl -fsS http://localhost:3000/ > /dev/null 2>&1; then
              echo "✅ Smoke test PASSED"
              docker logs bakery-smoke
              docker rm -f bakery-smoke
              exit 0
            fi
            echo "Waiting... (attempt $i/30)"
            sleep 2
          done
          
          echo "❌ Smoke test FAILED — container logs:"
          docker logs bakery-smoke
          docker rm -f bakery-smoke
          exit 1
        # NOTE: /api/health must exist — add a Payload health endpoint,
        # or change the curl URL to an existing route.

  # ─────────────────────────────────────────────────────────────
  # 11–13: Sign · Push to GHCR · Publish reports
  # ─────────────────────────────────────────────────────────────
  publish:
    name: Sign & Push to GHCR
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main' # only publish from main
    permissions:
      contents: read
      packages: write
      id-token: write # required for Cosign keyless signing

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 12. Push approved images to GHCR (rebuild with provenance/SBOM attestations)
      - name: Push image to GHCR
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.BACKEND_DIR }}
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ needs.docker.outputs.image-tag }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha,scope=bakery-backend

      # 13. Sign published images using Cosign (keyless, via GitHub OIDC)
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image with Cosign
        run: |
          cosign sign --yes \
            ${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}

    
      - name: Diagnose PostgreSQL and Payload CMS
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          echo "========== KUBERNETES PODS =========="
          kubectl -n "$NAMESPACE" get pods -o wide

          echo "========== SERVICES =========="
          kubectl -n "$NAMESPACE" get services

          echo "========== POSTGRESQL STATUS =========="
          kubectl -n "$NAMESPACE" get statefulsets

          echo "========== POSTGRESQL LOGS =========="
          kubectl -n "$NAMESPACE" logs \
            statefulset/postgres \
            --tail=100 || true

          echo "========== PAYLOAD CMS LOGS =========="
          kubectl -n "$NAMESPACE" logs \
            deployment/bakery-backend \
            --tail=150 || true

          echo "========== DATABASE SERVICE =========="
          kubectl -n "$NAMESPACE" get endpoints postgres || true

          echo "========== BACKEND ENV VARIABLE NAMES =========="
          kubectl -n "$NAMESPACE" exec \
            deployment/bakery-backend -- \
            sh -c 'env | cut -d= -f1 | sort' || true


      # Attach the SBOM to the pushed image (verifiable via cosign verify-attestation)
      - name: Download SBOM
        uses: actions/download-artifact@v4
        with:
          name: sbom
          path: .

      - name: Attach SBOM attestation
        run: |
          cosign attest --yes \
            --predicate sbom.spdx.json \
            --type spdx \
            ${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}

      - name: Verify signature (proves consumers can too)
        run: |
          cosign verify \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            ${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}

  # ─────────────────────────────────────────────────────────────
  # 13. Publish build & test reports (aggregated summary)
  # ─────────────────────────────────────────────────────────────
  publish-reports:
    name: Publish Reports
    runs-on: ubuntu-latest
    needs: [build-and-test, docker, publish]
    if: always()
    steps:
      - name: Download test results
        uses: actions/download-artifact@v4
        with:
          name: test-results
          path: reports/tests

      - name: Download security reports
        uses: actions/download-artifact@v4
        with:
          name: security-reports
          path: reports/security

      - name: Download SBOM
        uses: actions/download-artifact@v4
        with:
          name: sbom
          path: reports/sbom

      - name: Publish consolidated reports
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-reports
          path: reports/
          retention-days: 30