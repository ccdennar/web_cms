name: CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'bakery-backend/**'
      - '.github/workflows/ci-cd.yml'
  pull_request:
    branches: [main]
    paths:
      - 'bakery-backend/**'
      - '.github/workflows/ci-cd.yml'
  workflow_dispatch:

# Only non-secret, non-DB values live at workflow level.
# DB credentials are defined per job so they always match the service container.
env:
  BACKEND_DIR: bakery-backend
  IMAGE_NAME: ghcr.io/ccdennar/sweetcrumb-bakery-backend
  NODE_VERSION: "22"

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────
  # Build & Test
  # ─────────────────────────────────────────────────────────────
  build-and-test:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.BACKEND_DIR }}

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: payload
          POSTGRES_PASSWORD: payload
          POSTGRES_DB: payload_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payload -d payload_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Both names are set so it works whichever one payload.config.ts reads.
    # Credentials MUST match POSTGRES_USER / POSTGRES_PASSWORD above.
    env:
      DATABASE_URL: postgresql://payload:payload@localhost:5432/payload_test
      DATABASE_URI: postgresql://payload:payload@localhost:5432/payload_test
      PAYLOAD_SECRET: ci-test-secret-not-real

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10 # must match packageManager in package.json
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: ${{ env.BACKEND_DIR }}/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

      - name: Generate Payload types + TypeScript check
        run: |
          pnpm payload generate:types
          pnpm typecheck   # script: "tsc --noEmit" — verify it exists in package.json

      # Integration tests (Vitest) against the Postgres service container.
      # Reporter flags are passed without the extra "--" so Vitest actually receives them.
      - name: Run integration tests
        run: |
          mkdir -p test-results
          pnpm test:int --reporter=default --reporter=junit --outputFile.junit=test-results/int.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ${{ env.BACKEND_DIR }}/test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Build application
        run: pnpm build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: ${{ env.BACKEND_DIR }}/.next/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # Docker image + Trivy scan + SBOM + smoke test
  # ─────────────────────────────────────────────────────────────
  docker:
    name: Docker · Scan · SBOM
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: read
      security-events: write # for Trivy SARIF upload

    # Postgres for the smoke test (container runs with --network host)
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: payload
          POSTGRES_PASSWORD: payload
          POSTGRES_DB: payload_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payload -d payload_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine image tag
        id: meta
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "tag=latest-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=pr-${{ github.event.pull_request.number || 'manual' }}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          fi

      # Build locally (load) — push happens only in the publish job
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.BACKEND_DIR }}
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=bakery-backend
          cache-to: type=gha,mode=max,scope=bakery-backend

      - name: Trivy — dependency scan
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: fs
          scan-ref: ${{ env.BACKEND_DIR }}/pnpm-lock.yaml
          format: sarif
          output: trivy-deps.sarif
          severity: CRITICAL,HIGH

      - name: Trivy — image scan
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload Trivy results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif

      - name: Upload scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            trivy-deps.sarif
            trivy-image.sarif

      # Fail the pipeline if the IMAGE has fixable CRITICAL vulnerabilities
      - name: Trivy — gate on critical image vulnerabilities
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Generate SBOM
        uses: anchore/sbom-action@v0.17.2
        with:
          image: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json

      # Smoke test: --network host lets the container reach the Postgres
      # service on localhost (host.docker.internal doesn't exist on Linux runners).
      # Payload has no /api/health by default, so we hit /api/access and accept any
      # non-5xx response. Change SMOKE_PATH if you add a real health route.
      - name: Smoke test
        env:
          SMOKE_PATH: /api/access
        run: |
          docker run -d --name bakery-smoke --network host \
            -e PAYLOAD_SECRET=smoke-test-secret \
            -e DATABASE_URL=postgresql://payload:payload@localhost:5432/payload_test \
            -e DATABASE_URI=postgresql://payload:payload@localhost:5432/payload_test \
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}

          # Wait for the server to come up (max 60s)
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:3000${SMOKE_PATH}" || true)
            if [[ "$CODE" =~ ^[234][0-9][0-9]$ ]]; then
              echo "Smoke test PASSED (HTTP $CODE)"
              docker logs bakery-smoke
              docker rm -f bakery-smoke
              exit 0
            fi
            sleep 2
          done

          echo "Smoke test FAILED — container logs:"
          docker logs bakery-smoke
          docker rm -f bakery-smoke
          exit 1

  # ─────────────────────────────────────────────────────────────
  # Sign · Push to GHCR
  # ─────────────────────────────────────────────────────────────
  publish:
    name: Sign & Push to GHCR
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main' # only publish from main
    permissions:
      contents: read
      packages: write
      id-token: write # required for Cosign keyless signing

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.BACKEND_DIR }}
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ needs.docker.outputs.image-tag }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha,scope=bakery-backend

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image with Cosign
        run: |
          cosign sign --yes \
            ${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}

      - name: Download SBOM
        uses: actions/download-artifact@v4
        with:
          name: sbom
          path: .

      - name: Attach SBOM attestation
        run: |
          cosign attest --yes \
            --predicate sbom.spdx.json \
            --type spdx \
            ${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}

      - name: Verify signature
        run: |
          cosign verify \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            ${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}

  # ─────────────────────────────────────────────────────────────
  # Publish build & test reports (aggregated summary)
  # ─────────────────────────────────────────────────────────────
  publish-reports:
    name: Publish Reports
    runs-on: ubuntu-latest
    needs: [build-and-test, docker, publish]
    if: always()
    steps:
      # continue-on-error so a failed/skipped upstream job doesn't break the summary
      - name: Download test results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: test-results
          path: reports/tests

      - name: Download security reports
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: security-reports
          path: reports/security

      - name: Download SBOM
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: sbom
          path: reports/sbom

      - name: Publish consolidated reports
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-reports
          path: reports/
          if-no-files-found: warn
          retention-days: 30