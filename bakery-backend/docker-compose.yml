
name: bakery-backend

services:

  # ==========================================
  # SERVICE 1: SQLITE INITIALIZATION
  # ==========================================
  # Preserved for migration and rollback.
  # This service does NOT migrate SQLite
  # records into PostgreSQL.
  sqlite-init:
    image: alpine:3.22
    restart: "no"

    profiles:
      - migration

    volumes:
      - sqlite_data:/data
      - ./payload.db:/seed/payload.db:ro

    entrypoint: ["/bin/sh", "-c"]

    command:
      - |
        set -eu

        echo "Checking SQLite database..."

        if [ ! -f /data/payload.db ]; then
          if [ ! -f /seed/payload.db ]; then
            echo "ERROR: SQLite seed database missing."
            exit 1
          fi

          echo "Initializing SQLite database..."
          cp /seed/payload.db /data/payload.db
          echo "Database copied successfully."
        else
          echo "Existing SQLite database detected."
          echo "Skipping database initialization."
        fi

        echo "Configuring database permissions..."
        chown -R 1001:0 /data
        chmod -R g+rwX /data

        echo "SQLite initialization completed."

    networks:
      - bakery-network

  # ==========================================
  # SERVICE 2: POSTGRESQL DATABASE
  # ==========================================
  postgres:
    image: postgres:17-alpine

    restart: unless-stopped

    environment:
      POSTGRES_DB: sweetcrumb
      POSTGRES_USER: sweetcrumb
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    # PostgreSQL is only accessible inside
    # the Docker network.
    expose:
      - "5432"

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U sweetcrumb -d sweetcrumb
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    security_opt:
      - no-new-privileges:true

    networks:
      - bakery-network

  # ==========================================
  # SERVICE 3: PAYLOAD CMS BACKEND
  # ==========================================
  payload:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SERVER_URL: "http://localhost:3002"

    image: bakery-backend:local

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    # Port 3001 is used by the root project.
    # This separate backend uses port 3002.
    ports:
      - "127.0.0.1:3002:3000"

    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"

      # ======================================
      # POSTGRESQL DATABASE
      # ======================================
      DATABASE_URL: "postgresql://sweetcrumb:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/sweetcrumb"

      # ======================================
      # PAYLOAD CMS
      # ======================================
      NEXT_PUBLIC_SERVER_URL: "http://localhost:3002"

      PAYLOAD_SECRET: "${PAYLOAD_SECRET:?PAYLOAD_SECRET must be set}"

    volumes:
      # Preserve existing SQLite database
      # for migration and rollback.
      - sqlite_data:/app/data

      # Preserve uploaded media.
      - media_data:/app/media

    # ========================================
    # HEALTH CHECK
    # ========================================
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/pastries').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    # ========================================
    # SECURITY
    # ========================================
    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    networks:
      - bakery-network

# ==========================================
# PERSISTENT DOCKER VOLUMES
# ==========================================
volumes:

  # Original SQLite database.
  sqlite_data:
    name: bakery-backend_sqlite_data

  # PostgreSQL database.
  postgres_data:
    name: bakery-backend_postgres_data

  # Uploaded media.
  media_data:
    name: bakery-backend_media_data

# ==========================================
# DOCKER NETWORK
# ==========================================
networks:
  bakery-network:
    driver: bridge
